<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Memoirs of Disappearing Earth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&family=Plus+Jakarta+Sans:wght@400&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
  <!-- Leaflet — free open-source map, no API key needed -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { background: #F5EFE8; color: #2A1F1A; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 4rem; display: flex; align-items: center;
      padding: 0 2.5rem; justify-content: space-between;
      background: rgba(245,239,232,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(180,150,120,0.15);
    }
    .nav-wordmark {
      font-family: 'Outfit', sans-serif; font-size: 0.72rem;
      font-weight: 300; letter-spacing: 0.04em;
      color: rgba(60,45,35,0.7); font-style: italic;
    }
    .nav-links { display: flex; gap: 2.8rem; }
    .nav-links a {
      font-family: 'Space Mono', monospace; font-size: 8px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(60,45,35,0.55); transition: color 0.25s;
    }
    .nav-links a:hover, .nav-links a.active { color: rgba(60,45,35,1); }

    /* Page header */
    .page-header {
      padding-top: calc(4rem + 3rem); padding-bottom: 2.5rem;
      padding-inline: clamp(1.5rem, 4vw, 4rem);
      border-bottom: 1px solid rgba(180,150,120,0.15);
      margin-bottom: 0;
    }
    .eyebrow {
      font-family: 'Space Mono', monospace; font-size: 7.5px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(160,110,80,0.8); margin-bottom: 0.8rem;
    }
    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      font-weight: 200; letter-spacing: -0.01em; color: #2A1F1A;
    }

    /* Map fills the remaining viewport */
    #map {
      width: 100%; height: calc(100vh - 4rem - 8rem);
      min-height: 500px;
    }

    /* Custom pin */
    .custom-pin {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(160,110,80,0.9);
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 0 4px rgba(160,110,80,0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 0 !important;
      background: #F5EFE8 !important;
      border: 1px solid rgba(180,150,120,0.25) !important;
      box-shadow: 0 8px 32px rgba(42,31,26,0.12) !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip { background: #F5EFE8 !important; }
    .leaflet-popup-content { margin: 0 !important; width: 280px !important; }
    .popup-inner {
      padding: 1.2rem 1.4rem 1.4rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .popup-inner:hover { background: #EDE7DF; }
    .popup-img {
      width: 100%; aspect-ratio: 16/9;
      overflow: hidden; background: #DDD5C8;
      margin-bottom: 1rem;
    }
    .popup-img img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.6); }
    .popup-id {
      font-family: 'Space Mono', monospace; font-size: 7px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(160,110,80,0.8); margin-bottom: 0.4rem;
    }
    .popup-title {
      font-family: 'Outfit', sans-serif; font-size: 1.05rem;
      font-weight: 300; color: #2A1F1A; margin-bottom: 0.6rem;
    }
    .popup-desc {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem; color: rgba(42,31,26,0.55);
      line-height: 1.65; margin-bottom: 1rem;
    }
    .popup-cta {
      font-family: 'Space Mono', monospace; font-size: 7.5px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(160,110,80,0.8);
    }

    /* Footer */
    .footer {
      background: #EDE7DF; padding: 1.5rem 0;
      border-top: 1px solid rgba(180,150,120,0.15);
    }
    .footer-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding-inline: clamp(1.5rem, 4vw, 4rem);
    }
    .footer-copy {
      font-family: 'Space Mono', monospace; font-size: 7.5px;
      letter-spacing: 0.1em; color: rgba(60,45,35,0.32);
    }

    @media (max-width: 768px) { .nav-links { display: none; } }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-wordmark">Memoirs of Disappearing Earth</a>
    <ul class="nav-links">
      <li><a href="index.html">Field</a></li>
      <li><a href="archive.html" class="active">Archive</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <p class="eyebrow">Field Archive — Active Sites</p>
    <h1 class="page-title">Archive</h1>
  </header>

  <div id="map"></div>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-copy">© 2025 — Memoirs of Disappearing Earth — IAAC / MDEF</span>
      <span class="footer-copy">01 Active Field Site</span>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ── MAP INIT ── */
    const map = L.map('map', {
      center: [41.38, 2.08],
      zoom: 11,
      zoomControl: true,
      scrollWheelZoom: true,
    });

    /* Light natural tile layer — Stamen Toner Lite / CartoDB Positron */
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19,
    }).addTo(map);

    /* ── CUSTOM PIN ICON ── */
    const pinIcon = L.divIcon({
      className: '',
      html: '<div class="custom-pin"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7],
      popupAnchor: [0, -12],
    });

    /* ── LLOBREGAT MARKER ── */
    const llobregat = L.marker([41.3168, 2.0697], { icon: pinIcon }).addTo(map);

    const popupContent = `
      <div class="popup-inner" onclick="window.location.href='work.html'">
        <div class="popup-img">
          <img src="assets/images/web-01.jpg" alt="Llobregat River field session"
               onerror="this.parentElement.style.background='#C8BFB2'" />
        </div>
        <p class="popup-id">Archive — 001 · 2025</p>
        <p class="popup-title">Llobregat River Field Session</p>
        <p class="popup-desc">
          This site was chosen because it represents the ultimate collision
          between intense human intervention (the Barcelona-El Prat Airport
          expansion) and raw biogeochemical forces.
        </p>
        <span class="popup-cta">View Full Archive →</span>
      </div>
    `;

    llobregat.bindPopup(popupContent, {
      maxWidth: 300,
      closeButton: true,
    });

    /* Open popup on click */
    llobregat.on('click', function() {
      this.openPopup();
    });
  </script>
</body>
</html>
